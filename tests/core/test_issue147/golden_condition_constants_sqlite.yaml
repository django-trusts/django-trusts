              SELECT "documents_constantdocument"."id", "documents_constantdocument"."amount", "documents_constantdocument"."payload", "documents_constantdocument"."price", "documents_constantdocument"."token", "documents_constantdocument"."day", "documents_constantdocument"."clock", "documents_constantdocument"."stamp", "documents_constantdocument"."span", "documents_constantdocument"."label", "documents_constantdocument"."owner_id" FROM "documents_constantdocument" WHERE "documents_constantdocument"."amount" = %s
            params: [{const: {type: "float", value: "NaN"}}]
          - id: "infinity"
            sql: |-
              SELECT "documents_constantdocument"."id", "documents_constantdocument"."amount", "documents_constantdocument"."payload", "documents_constantdocument"."price", "documents_constantdocument"."token", "documents_constantdocument"."day", "documents_constantdocument"."clock", "documents_constantdocument"."stamp", "documents_constantdocument"."span", "documents_constantdocument"."label", "documents_constantdocument"."owner_id" FROM "documents_constantdocument" WHERE "documents_constantdocument"."amount" = %s
            params: [{const: {type: "float", value: "Infinity"}}]
          - id: "negative_infinity"
            sql: |-
              SELECT "documents_constantdocument"."id", "documents_constantdocument"."amount", "documents_constantdocument"."payload", "documents_constantdocument"."price", "documents_constantdocument"."token", "documents_constantdocument"."day", "documents_constantdocument"."clock", "documents_constantdocument"."stamp", "documents_constantdocument"."span", "documents_constantdocument"."label", "documents_constantdocument"."owner_id" FROM "documents_constantdocument" WHERE "documents_constantdocument"."amount" = %s
            params: [{const: {type: "float", value: "-Infinity"}}]
          - id: "payload"
            sql: |-
              SELECT "documents_constantdocument"."id", "documents_constantdocument"."amount", "documents_constantdocument"."payload", "documents_constantdocument"."price", "documents_constantdocument"."token", "documents_constantdocument"."day", "documents_constantdocument"."clock", "documents_constantdocument"."stamp", "documents_constantdocument"."span", "documents_constantdocument"."label", "documents_constantdocument"."owner_id" FROM "documents_constantdocument" WHERE "documents_constantdocument"."payload" = %s
            params: [{const: {type: "bytes", hex: "00ff"}}]
          - id: "price"
            sql: |-
              SELECT "documents_constantdocument"."id", "documents_constantdocument"."amount", "documents_constantdocument"."payload", "documents_constantdocument"."price", "documents_constantdocument"."token", "documents_constantdocument"."day", "documents_constantdocument"."clock", "documents_constantdocument"."stamp", "documents_constantdocument"."span", "documents_constantdocument"."label", "documents_constantdocument"."owner_id" FROM "documents_constantdocument" WHERE "documents_constantdocument"."price" = %s
            params: [{const: {type: "decimal", value: "12.50"}}]
          - id: "token"
            sql: |-
              SELECT "documents_constantdocument"."id", "documents_constantdocument"."amount", "documents_constantdocument"."payload", "documents_constantdocument"."price", "documents_constantdocument"."token", "documents_constantdocument"."day", "documents_constantdocument"."clock", "documents_constantdocument"."stamp", "documents_constantdocument"."span", "documents_constantdocument"."label", "documents_constantdocument"."owner_id" FROM "documents_constantdocument" WHERE "documents_constantdocument"."token" = %s
