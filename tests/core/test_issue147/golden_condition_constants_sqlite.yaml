            params: [{const: {type: "date", value: "2024-03-04"}}]
          - id: "clock"
            sql: |-
              SELECT "documents_constantdocument"."id", "documents_constantdocument"."amount", "documents_constantdocument"."payload", "documents_constantdocument"."price", "documents_constantdocument"."token", "documents_constantdocument"."day", "documents_constantdocument"."clock", "documents_constantdocument"."stamp", "documents_constantdocument"."span", "documents_constantdocument"."label", "documents_constantdocument"."owner_id" FROM "documents_constantdocument" WHERE "documents_constantdocument"."clock" = %s
            params: [{const: {type: "time", value: "05:06:07"}}]
          - id: "stamp"
