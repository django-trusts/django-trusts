          - id: "owner"
            sql: |-
              SELECT "documents_constantdocument"."id", "documents_constantdocument"."amount", "documents_constantdocument"."payload", "documents_constantdocument"."price", "documents_constantdocument"."token", "documents_constantdocument"."day", "documents_constantdocument"."clock", "documents_constantdocument"."stamp", "documents_constantdocument"."span", "documents_constantdocument"."label", "documents_constantdocument"."owner_id" FROM "documents_constantdocument" WHERE "documents_constantdocument"."owner_id" = %s
            params: [{const: {type: "model", app_label: "auth", model: "user", pk: 7}}]
          - id: "label"
            sql: |-
              SELECT "documents_constantdocument"."id", "documents_constantdocument"."amount", "documents_constantdocument"."payload", "documents_constantdocument"."price", "documents_constantdocument"."token", "documents_constantdocument"."day", "documents_constantdocument"."clock", "documents_constantdocument"."stamp", "documents_constantdocument"."span", "documents_constantdocument"."label", "documents_constantdocument"."owner_id" FROM "documents_constantdocument" WHERE "documents_constantdocument"."label" = %s
