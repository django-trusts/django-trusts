schema_version: 1
database:
  engine: "django.db.backends.sqlite3"
backends:
  - path: "documents.backends.DocumentBackend"
    contents:
      - model: "documents.Document"
        trusts:
          - id: "documents__DocumentPermission__document"
            root: "documents.DocumentPermission"
            user: {path: "user", model: "auth.User", target: "id"}
            permission: {path: "permission", model: "auth.Permission", target: "id"}
            content: {path: "document", model: "documents.Document", target: "id"}
        permitted:
          params: [{const: 1}, {bind: "permission.id"}, {bind: "user.id"}]
          sql: |-
            SELECT DISTINCT "documents_document"."id", "documents_document"."title", "documents_document"."confidential" FROM "documents_document" WHERE EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = %s AND "U0"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1)
        has_perm:
          params: [{const: 1}, {const: 1}, {const: 1}, {bind: "permission.id"}, {bind: "user.id"}]
          sql: |-
            SELECT %s AS "a" FROM "documents_document" WHERE ("documents_document"."id" = %s AND EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = %s AND "U0"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1)) LIMIT 1
        get_all_permissions:
          params: [{const: 1}, {const: 1}, {const: 1}, {const: 1}, {const: 1}, {bind: "user.id"}]
          sql: |-
            SELECT DISTINCT "auth_permission"."id", "auth_permission"."name", "auth_permission"."content_type_id", "auth_permission"."codename", "django_content_type"."app_label", "django_content_type"."model" FROM "auth_permission" INNER JOIN "django_content_type" ON ("auth_permission"."content_type_id" = "django_content_type"."id") WHERE (EXISTS(SELECT %s AS "a" FROM "documents_document" "U0" WHERE "U0"."id" = %s LIMIT 1) AND NOT (EXISTS(SELECT %s AS "a" FROM "documents_document" "V0" WHERE ("V0"."id" = %s AND NOT (EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = ("auth_permission"."id") AND "U0"."user_id" = %s AND "U0"."document_id" = ("V0"."id")) LIMIT 1))) LIMIT 1))) ORDER BY "django_content_type"."app_label" ASC, "django_content_type"."model" ASC, "auth_permission"."codename" ASC
        get_permitted_users:
          params: [{const: true}, {const: 1}, {bind: "content.id"}, {bind: "permission.id"}]
          sql: |-
            SELECT DISTINCT "auth_user"."id", "auth_user"."password", "auth_user"."last_login", "auth_user"."is_superuser", "auth_user"."username", "auth_user"."first_name", "auth_user"."last_name", "auth_user"."email", "auth_user"."is_staff", "auth_user"."is_active", "auth_user"."date_joined" FROM "auth_user" WHERE ("auth_user"."is_active" = %s AND EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."document_id" = %s AND "U0"."permission_id" = %s AND "U0"."user_id" = ("auth_user"."id")) LIMIT 1))
        named_filters:
          - id: "documents__Document__non_confidential"
            params: [{const: true}]
            sql: |-
              SELECT "documents_document"."id", "documents_document"."title", "documents_document"."confidential" FROM "documents_document" WHERE ("documents_document"."confidential" IS NULL OR NOT ("documents_document"."confidential" = %s))
  - path: "documents.backends.OrBackend"
    contents:
      - model: "documents.Document"
        trusts:
          - id: "documents__DocumentPermission__document"
            root: "documents.DocumentPermission"
            user: {path: "user", model: "auth.User", target: "id"}
            permission: {path: "permission", model: "auth.Permission", target: "id"}
            content: {path: "document", model: "documents.Document", target: "id"}
            or_group: true
          - id: "documents__TeamDocumentPermission__document"
            root: "documents.TeamDocumentPermission"
            user: {path: "team__members", model: "auth.User", target: "id"}
            permission: {path: "permission", model: "auth.Permission", target: "id"}
            content: {path: "document", model: "documents.Document", target: "id"}
            or_group: true
        permitted:
          params: [{const: 1}, {bind: "permission.id"}, {bind: "user.id"}, {const: 1}, {bind: "permission.id"}, {bind: "user.id"}]
          sql: |-
            SELECT DISTINCT "documents_document"."id", "documents_document"."title", "documents_document"."confidential" FROM "documents_document" WHERE (EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = %s AND "U0"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1) OR EXISTS(SELECT %s AS "a" FROM "documents_teamdocumentpermission" "U0" INNER JOIN "documents_team" "U2" ON ("U0"."team_id" = "U2"."id") INNER JOIN "documents_team_members" "U3" ON ("U2"."id" = "U3"."team_id") WHERE ("U0"."permission_id" = %s AND "U3"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1))
        has_perm:
          params: [{const: 1}, {const: 1}, {const: 1}, {bind: "permission.id"}, {bind: "user.id"}, {const: 1}, {bind: "permission.id"}, {bind: "user.id"}]
          sql: |-
            SELECT %s AS "a" FROM "documents_document" WHERE ("documents_document"."id" = %s AND (EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = %s AND "U0"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1) OR EXISTS(SELECT %s AS "a" FROM "documents_teamdocumentpermission" "U0" INNER JOIN "documents_team" "U2" ON ("U0"."team_id" = "U2"."id") INNER JOIN "documents_team_members" "U3" ON ("U2"."id" = "U3"."team_id") WHERE ("U0"."permission_id" = %s AND "U3"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1))) LIMIT 1
        get_all_permissions:
          params: [{const: 1}, {const: 1}, {const: 1}, {const: 1}, {const: 1}, {bind: "user.id"}, {const: 1}, {bind: "user.id"}]
          sql: |-
            SELECT DISTINCT "auth_permission"."id", "auth_permission"."name", "auth_permission"."content_type_id", "auth_permission"."codename", "django_content_type"."app_label", "django_content_type"."model" FROM "auth_permission" INNER JOIN "django_content_type" ON ("auth_permission"."content_type_id" = "django_content_type"."id") WHERE (EXISTS(SELECT %s AS "a" FROM "documents_document" "U0" WHERE "U0"."id" = %s LIMIT 1) AND NOT (EXISTS(SELECT %s AS "a" FROM "documents_document" "V0" WHERE ("V0"."id" = %s AND NOT (EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = ("auth_permission"."id") AND "U0"."user_id" = %s AND "U0"."document_id" = ("V0"."id")) LIMIT 1) OR EXISTS(SELECT %s AS "a" FROM "documents_teamdocumentpermission" "U0" INNER JOIN "documents_team" "U2" ON ("U0"."team_id" = "U2"."id") INNER JOIN "documents_team_members" "U3" ON ("U2"."id" = "U3"."team_id") WHERE ("U0"."permission_id" = ("auth_permission"."id") AND "U3"."user_id" = %s AND "U0"."document_id" = ("V0"."id")) LIMIT 1))) LIMIT 1))) ORDER BY "django_content_type"."app_label" ASC, "django_content_type"."model" ASC, "auth_permission"."codename" ASC
        get_permitted_users:
          params: [{const: true}, {const: 1}, {bind: "content.id"}, {bind: "permission.id"}, {const: 1}, {bind: "content.id"}, {bind: "permission.id"}]
          sql: |-
            SELECT DISTINCT "auth_user"."id", "auth_user"."password", "auth_user"."last_login", "auth_user"."is_superuser", "auth_user"."username", "auth_user"."first_name", "auth_user"."last_name", "auth_user"."email", "auth_user"."is_staff", "auth_user"."is_active", "auth_user"."date_joined" FROM "auth_user" WHERE ("auth_user"."is_active" = %s AND (EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."document_id" = %s AND "U0"."permission_id" = %s AND "U0"."user_id" = ("auth_user"."id")) LIMIT 1) OR EXISTS(SELECT %s AS "a" FROM "documents_teamdocumentpermission" "U0" INNER JOIN "documents_team" "U3" ON ("U0"."team_id" = "U3"."id") INNER JOIN "documents_team_members" "U4" ON ("U3"."id" = "U4"."team_id") WHERE ("U0"."document_id" = %s AND "U0"."permission_id" = %s AND "U4"."user_id" = ("auth_user"."id")) LIMIT 1)))
