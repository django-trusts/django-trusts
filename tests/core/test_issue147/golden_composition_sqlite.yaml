schema_version: 1
lockfile: false
role: "composition-evidence"
first_drop:
  - "trust.authorized"
  - "named_filter"
rules:
  - "A reference is valid only when the fragment SQL, aliases included, occurs in the expanded statement and that fragment's parameters occupy the same contiguous span."
  - "Expansion replaces each placeholder with the fragment SQL and splices the fragment parameters at that position. Parameters that sit outside the fragment stay in template order."
  - "Outer aliases or a different permission bind that change the fragment text require the full statement. There is no token whose expansion is guessed."
  - "The lockfile named-filter row is the full SELECT. Filter-to-grant composition references only that statement's WHERE predicate."
  - "Instance has_perm is a candidate primary-key predicate plus grant EXISTS, not IN (<< .authorized() subquery >>). .authorized() is a content SELECT."
database:
  engine: "django.db.backends.sqlite3"
backends:
  - path: "documents.backends.DocumentBackend"
    fragments:
      - id: "grant:documents.DocumentPermission:document"
        kind: "grant_exists"
        denotes: "EXISTS body of this trust's .authorized() statement, including aliases and parameter order."
        sql: |-
          SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = %s AND "U0"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1
        params:
          - const: 1
          - bind: "permission.id"
          - bind: "user.id"
      - id: "predicate:documents.Document:non_confidential"
        kind: "named_filter_predicate"
        denotes: "WHERE predicate of the named-filter SELECT. Not that SELECT and not a grant."
        sql: |-
          ("documents_document"."confidential" IS NULL OR NOT ("documents_document"."confidential" = %s))
        params:
          - const: true
    operations:
      - id: "authorized:documents.DocumentPermission:document"
        kind: "trust.authorized"
        enters_lockfile: true
        representation: "full_sql"
        reason: "Lockfile row. Full content SELECT for this trust."
        expanded:
          sql: |-
            SELECT DISTINCT "documents_document"."id", "documents_document"."title", "documents_document"."confidential" FROM "documents_document" WHERE EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = %s AND "U0"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1)
          params:
            - const: 1
            - bind: "permission.id"
            - bind: "user.id"
      - id: "named_filter:documents.Document:non_confidential"
        kind: "named_filter"
        enters_lockfile: true
        representation: "full_sql"
        reason: "Lockfile row. Standalone named-filter SELECT, not combined with a grant."
        expanded:
          sql: |-
            SELECT "documents_document"."id", "documents_document"."title", "documents_document"."confidential" FROM "documents_document" WHERE ("documents_document"."confidential" IS NULL OR NOT ("documents_document"."confidential" = %s))
          params:
            - const: true
      - id: "has_perm_permission_instance"
        kind: "has_perm_permission_instance"
        enters_lockfile: false
        representation: "structured"
        reason: "Candidate primary-key predicate plus grant EXISTS. Reuses the grant fragment only when that text matches. This is not the .authorized() SELECT and not IN (authorized subquery). Parameter order is the exists() probe, the candidate primary-key sentinel, then the fragment parameters."
        structured:
          sql: |-
            SELECT %s AS "a" FROM "documents_document" WHERE ("documents_document"."id" = %s AND EXISTS({{grant:documents.DocumentPermission:document}})) LIMIT 1
          refs:
            - placeholder: "{{grant:documents.DocumentPermission:document}}"
              fragment: "grant:documents.DocumentPermission:document"
        expanded:
          sql: |-
            SELECT %s AS "a" FROM "documents_document" WHERE ("documents_document"."id" = %s AND EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = %s AND "U0"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1)) LIMIT 1
          params:
            - const: 1
            - const: 1
            - const: 1
            - bind: "permission.id"
            - bind: "user.id"
      - id: "has_perm_permission_code"
        kind: "has_perm_permission_code"
        enters_lockfile: false
        representation: "full_sql"
        reason: "Permission-code has_perm binds permission through a codename subquery. Full SQL when that changes the grant text or aliases."
        expanded:
          sql: |-
            SELECT %s AS "a" FROM "documents_document" WHERE ("documents_document"."id" = %s AND EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "V0" WHERE ("V0"."permission_id" = (SELECT "U0"."id" AS "pk" FROM "auth_permission" "U0" INNER JOIN "django_content_type" "U1" ON ("U0"."content_type_id" = "U1"."id") WHERE ("U0"."codename" = %s AND "U1"."app_label" = %s AND "U1"."model" = %s) ORDER BY "U1"."app_label" ASC, "U1"."model" ASC, "U0"."codename" ASC LIMIT 1) AND "V0"."user_id" = %s AND "V0"."document_id" = ("documents_document"."id")) LIMIT 1)) LIMIT 1
          params:
            - const: 1
            - const: 1
            - const: 1
            - const: "change_document"
            - const: "documents"
            - const: "document"
            - bind: "user.id"
        locked_fragments:
          - "grant:documents.DocumentPermission:document"
        expanded_exists:
          - sql: |-
              SELECT %s AS "a" FROM "documents_documentpermission" "V0" WHERE ("V0"."permission_id" = (SELECT "U0"."id" AS "pk" FROM "auth_permission" "U0" INNER JOIN "django_content_type" "U1" ON ("U0"."content_type_id" = "U1"."id") WHERE ("U0"."codename" = %s AND "U1"."app_label" = %s AND "U1"."model" = %s) ORDER BY "U1"."app_label" ASC, "U1"."model" ASC, "U0"."codename" ASC LIMIT 1) AND "V0"."user_id" = %s AND "V0"."document_id" = ("documents_document"."id")) LIMIT 1
      - id: "authorized_and_named_filter:non_confidential"
        kind: "authorized_and_named_filter"
        enters_lockfile: false
        representation: "structured"
        reason: "Runtime AND of the grant EXISTS with the named-filter predicate. The named-filter SELECT stays a separate lockfile row."
        structured:
          sql: |-
            SELECT DISTINCT "documents_document"."id", "documents_document"."title", "documents_document"."confidential" FROM "documents_document" WHERE (EXISTS({{grant:documents.DocumentPermission:document}}) AND {{predicate:documents.Document:non_confidential}})
          refs:
            - placeholder: "{{grant:documents.DocumentPermission:document}}"
              fragment: "grant:documents.DocumentPermission:document"
            - placeholder: "{{predicate:documents.Document:non_confidential}}"
              fragment: "predicate:documents.Document:non_confidential"
        expanded:
          sql: |-
            SELECT DISTINCT "documents_document"."id", "documents_document"."title", "documents_document"."confidential" FROM "documents_document" WHERE (EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = %s AND "U0"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1) AND ("documents_document"."confidential" IS NULL OR NOT ("documents_document"."confidential" = %s)))
          params:
            - const: 1
            - bind: "permission.id"
            - bind: "user.id"
            - const: true
      - id: "queryset_has_perm"
        kind: "queryset_has_perm"
        enters_lockfile: false
        representation: "structured"
        reason: "all_match COUNT/FILTER statement. The grant EXISTS is nested under NOT. The outer aggregate is not the .authorized() SELECT."
        structured:
          sql: |-
            SELECT COUNT(DISTINCT "documents_document"."id") AS "total", COUNT(DISTINCT "documents_document"."id") FILTER (WHERE NOT (EXISTS({{grant:documents.DocumentPermission:document}}))) AS "lacking" FROM "documents_document"
          refs:
            - placeholder: "{{grant:documents.DocumentPermission:document}}"
              fragment: "grant:documents.DocumentPermission:document"
        expanded:
          sql: |-
            SELECT COUNT(DISTINCT "documents_document"."id") AS "total", COUNT(DISTINCT "documents_document"."id") FILTER (WHERE NOT (EXISTS(SELECT %s AS "a" FROM "documents_documentpermission" "U0" WHERE ("U0"."permission_id" = %s AND "U0"."user_id" = %s AND "U0"."document_id" = ("documents_document"."id")) LIMIT 1))) AS "lacking" FROM "documents_document"
          params:
            - const: 1
            - bind: "permission.id"
            - bind: "user.id"
  - path: "documents.backends.OrBackend"
    fragments:
      - id: "grant:documents.DocumentPermission:document"
