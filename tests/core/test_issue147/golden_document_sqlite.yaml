schema_version: 1
database:
  engine: "django.db.backends.sqlite3"
backends:
  - path: "documents.backends.DocumentBackend"
    contents:
      - model: "documents.Document"
        trusts:
          - id: "documents__DocumentPermission__document"
            root: "documents.DocumentPermission"
            user: {path: "user", model: "auth.User", target: "id"}
            permission: {path: "permission", model: "auth.Permission", target: "id"}
            content: {path: "document", model: "documents.Document", target: "id"}
        permitted:
          params: ["$user.id", "$permission.id", "user.is_active=True", "$content.app_label=\"documents\"", "$content.model=\"document\"", "skip_is_active=False"]
          sql: |-
            SELECT DISTINCT "documents_document"."id", "documents_document"."title", "documents_document"."confidential"
            FROM "documents_document"
            CROSS JOIN (
              SELECT %s AS "user_id", %s AS "permission_id", %s AS "is_active", %s AS "app_label", %s AS "model"
            ) "trusts_bind"
            WHERE (
              EXISTS (
                SELECT 1 AS "a"
                FROM "auth_user" "U0"
                WHERE ("U0"."id" = ("trusts_bind"."user_id")
                    AND ((%s)
                      OR "U0"."is_active" = ("trusts_bind"."is_active")
                  )
                )
                LIMIT 1
              )
              AND EXISTS (
                SELECT 1 AS "a"
                FROM "documents_documentpermission" "U0"
                INNER JOIN "auth_permission" "U1" ON ("U0"."permission_id" = "U1"."id")
                INNER JOIN "django_content_type" "U2" ON ("U1"."content_type_id" = "U2"."id")
                WHERE ("U0"."permission_id" = ("trusts_bind"."permission_id")
                    AND "U2"."app_label" = ("trusts_bind"."app_label")
                    AND "U2"."model" = ("trusts_bind"."model")
                    AND "U0"."user_id" = ("trusts_bind"."user_id")
                    AND "U0"."document_id" = ("documents_document"."id")
                )
                LIMIT 1
              ) )
        has_perm:
          params: ["$user.id", "$permission.id", "$content.id", "user.is_active=True", "$content.app_label=\"documents\"", "$content.model=\"document\"", "skip_is_active=False"]
          sql: |-
            SELECT 1 AS "a"
            FROM "documents_document"
            CROSS JOIN (
              SELECT %s AS "user_id", %s AS "permission_id", %s AS "content_pk", %s AS "is_active", %s AS "app_label", %s AS "model"
            ) "trusts_bind"
            WHERE ("documents_document"."id" = ("trusts_bind"."content_pk")
              AND EXISTS (
                SELECT 1 AS "a"
                FROM "auth_user" "U0"
                WHERE ("U0"."id" = ("trusts_bind"."user_id")
                    AND ((%s)
                      OR "U0"."is_active" = ("trusts_bind"."is_active")
                  )
                )
                LIMIT 1
              )
              AND EXISTS (
                SELECT 1 AS "a"
                FROM "documents_documentpermission" "U0"
                INNER JOIN "auth_permission" "U1" ON ("U0"."permission_id" = "U1"."id")
                INNER JOIN "django_content_type" "U2" ON ("U1"."content_type_id" = "U2"."id")
                WHERE ("U0"."permission_id" = ("trusts_bind"."permission_id")
                    AND "U2"."app_label" = ("trusts_bind"."app_label")
                    AND "U2"."model" = ("trusts_bind"."model")
                    AND "U0"."user_id" = ("trusts_bind"."user_id")
                    AND "U0"."document_id" = ("documents_document"."id")
                )
                LIMIT 1
              ) )
            LIMIT 1
        get_all_permissions:
          params: ["$user.id", "$content.id", "user.is_active=True", "$content.app_label=\"documents\"", "$content.model=\"document\"", "skip_is_active=False"]
          sql: |-
            SELECT DISTINCT "auth_permission"."id", "auth_permission"."name", "auth_permission"."content_type_id", "auth_permission"."codename", "django_content_type"."app_label", "django_content_type"."model"
            FROM "auth_permission"
            CROSS JOIN (
              SELECT %s AS "user_id", %s AS "content_pk", %s AS "is_active", %s AS "app_label", %s AS "model"
            ) "trusts_bind"
            INNER JOIN "django_content_type" ON ("auth_permission"."content_type_id" = "django_content_type"."id")
            WHERE (
              EXISTS (
                SELECT 1 AS "a"
                FROM "documents_document" "U0"
                WHERE "U0"."id" = ("trusts_bind"."content_pk")
                LIMIT 1
              )
              AND NOT ( EXISTS (
                  SELECT 1 AS "a"
                  FROM "documents_document" "V0"
                  WHERE ("V0"."id" = ("trusts_bind"."content_pk")
                      AND NOT ( EXISTS (
                        SELECT 1 AS "a"
                        FROM "auth_user" "U0"
                        WHERE ("U0"."id" = ("trusts_bind"."user_id")
                            AND ((%s)
                              OR "U0"."is_active" = ("trusts_bind"."is_active")
                          )
                        )
                        LIMIT 1
                      )
                      AND EXISTS (
                        SELECT 1 AS "a"
                        FROM "documents_documentpermission" "U0"
                        INNER JOIN "auth_permission" "U1" ON ("U0"."permission_id" = "U1"."id")
                        INNER JOIN "django_content_type" "U2" ON ("U1"."content_type_id" = "U2"."id")
                        WHERE ("U0"."permission_id" = ("auth_permission"."id")
                            AND "U2"."app_label" = ("trusts_bind"."app_label")
                            AND "U2"."model" = ("trusts_bind"."model")
                            AND "U0"."user_id" = ("trusts_bind"."user_id")
                            AND "U0"."document_id" = ("V0"."id")
                        )
                        LIMIT 1
                      ) ) )
                  LIMIT 1
                ) ) )
            ORDER BY "django_content_type"."app_label" ASC, "django_content_type"."model" ASC, "auth_permission"."codename" ASC
        get_permitted_users:
          params: ["$permission.id", "$content.id", "user.is_active=True", "$content.app_label=\"documents\"", "$content.model=\"document\"", "skip_is_active=False"]
          sql: |-
            SELECT DISTINCT "auth_user"."id", "auth_user"."password", "auth_user"."last_login", "auth_user"."is_superuser", "auth_user"."username", "auth_user"."first_name", "auth_user"."last_name", "auth_user"."email", "auth_user"."is_staff", "auth_user"."is_active", "auth_user"."date_joined"
            FROM "auth_user"
            CROSS JOIN (
              SELECT %s AS "permission_id", %s AS "content_id", %s AS "is_active", %s AS "app_label", %s AS "model"
            ) "trusts_bind"
            WHERE (((%s)
                  OR "auth_user"."is_active" = ("trusts_bind"."is_active")
              )
              AND EXISTS (
                SELECT 1 AS "a"
                FROM "documents_documentpermission" "U0"
                INNER JOIN "auth_permission" "U2" ON ("U0"."permission_id" = "U2"."id")
                INNER JOIN "django_content_type" "U3" ON ("U2"."content_type_id" = "U3"."id")
                WHERE ("U0"."document_id" = ("trusts_bind"."content_id")
                    AND "U0"."permission_id" = ("trusts_bind"."permission_id")
                    AND "U3"."app_label" = ("trusts_bind"."app_label")
                    AND "U3"."model" = ("trusts_bind"."model")
                    AND "U0"."user_id" = ("auth_user"."id")
                )
                LIMIT 1
              ) )
        named_filters:
          - id: "documents__Document__non_confidential"
            params: ["confidential=True"]
            sql: |-
              SELECT "documents_document"."id", "documents_document"."title", "documents_document"."confidential"
              FROM "documents_document"
              WHERE ("documents_document"."confidential" IS NULL
                  OR NOT ("documents_document"."confidential" = %s)
              )
            has_perm:
              params: ["$user.id", "$permission.id", "$content.id", "user.is_active=True", "$content.app_label=\"documents\"", "$content.model=\"document\"", "skip_is_active=False", "confidential=True"]
              sql: |-
                SELECT 1 AS "a"
                FROM "documents_document"
                CROSS JOIN (
                  SELECT %s AS "user_id", %s AS "permission_id", %s AS "content_pk", %s AS "is_active", %s AS "app_label", %s AS "model"
                ) "trusts_bind"
                WHERE ("documents_document"."id" = ("trusts_bind"."content_pk")
                  AND EXISTS (
                    SELECT 1 AS "a"
                    FROM "auth_user" "U0"
                    WHERE ("U0"."id" = ("trusts_bind"."user_id")
                        AND ((%s)
                          OR "U0"."is_active" = ("trusts_bind"."is_active")
                      )
                    )
                    LIMIT 1
                  )
                  AND EXISTS (
                    SELECT 1 AS "a"
                    FROM "documents_documentpermission" "U0"
                    INNER JOIN "auth_permission" "U1" ON ("U0"."permission_id" = "U1"."id")
                    INNER JOIN "django_content_type" "U2" ON ("U1"."content_type_id" = "U2"."id")
                    WHERE ("U0"."permission_id" = ("trusts_bind"."permission_id")
                        AND "U2"."app_label" = ("trusts_bind"."app_label")
                        AND "U2"."model" = ("trusts_bind"."model")
                        AND "U0"."user_id" = ("trusts_bind"."user_id")
                        AND "U0"."document_id" = ("documents_document"."id")
                    )
                    LIMIT 1
                  )
                    AND ("documents_document"."confidential" IS NULL
                      OR NOT ("documents_document"."confidential" = %s)
                  )
                )
                LIMIT 1
            permitted:
              params: ["$user.id", "$permission.id", "user.is_active=True", "$content.app_label=\"documents\"", "$content.model=\"document\"", "skip_is_active=False", "confidential=True"]
              sql: |-
                SELECT DISTINCT "documents_document"."id", "documents_document"."title", "documents_document"."confidential"
                FROM "documents_document"
                CROSS JOIN (
                  SELECT %s AS "user_id", %s AS "permission_id", %s AS "is_active", %s AS "app_label", %s AS "model"
                ) "trusts_bind"
                WHERE (
                  EXISTS (
                    SELECT 1 AS "a"
                    FROM "auth_user" "U0"
                    WHERE ("U0"."id" = ("trusts_bind"."user_id")
                        AND ((%s)
                          OR "U0"."is_active" = ("trusts_bind"."is_active")
                      )
                    )
                    LIMIT 1
                  )
                  AND EXISTS (
                    SELECT 1 AS "a"
                    FROM "documents_documentpermission" "U0"
                    INNER JOIN "auth_permission" "U1" ON ("U0"."permission_id" = "U1"."id")
                    INNER JOIN "django_content_type" "U2" ON ("U1"."content_type_id" = "U2"."id")
                    WHERE ("U0"."permission_id" = ("trusts_bind"."permission_id")
                        AND "U2"."app_label" = ("trusts_bind"."app_label")
                        AND "U2"."model" = ("trusts_bind"."model")
                        AND "U0"."user_id" = ("trusts_bind"."user_id")
                        AND "U0"."document_id" = ("documents_document"."id")
                    )
                    LIMIT 1
                  )
                    AND ("documents_document"."confidential" IS NULL
                      OR NOT ("documents_document"."confidential" = %s)
                  )
                )
