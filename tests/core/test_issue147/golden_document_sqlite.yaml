schema_version: 1
database:
  engine: "django.db.backends.sqlite3"
backends:
  - path: "documents.backends.DocumentBackend"
    contents:
      - model: "documents.Document"
        trusts:
          - id: "documents__DocumentPermission__document"
            root: "documents.DocumentPermission"
            user: {path: "user", model: "auth.User", target: "id"}
            permission: {path: "permission", model: "auth.Permission", target: "id"}
            content: {path: "document", model: "documents.Document", target: "id"}
        permitted:
          params: [{bind: "permission.id", hint: "$permission"}, {const: "documents", hint: "content type app"}, {const: "document", hint: "content type model"}, {bind: "user.id", hint: "$user"}]
          sql: |-
            SELECT DISTINCT "documents_document"."id", "documents_document"."title", "documents_document"."confidential"
            FROM "documents_document"
            CROSS JOIN (
              SELECT %s AS "permission_id", %s AS "app_label", %s AS "model", %s AS "user_id"
            ) "trusts_bind"
            WHERE
            EXISTS (
              SELECT 1 AS "a"
              FROM "documents_documentpermission" "U0"
              INNER JOIN "auth_permission" "U1" ON ("U0"."permission_id" = "U1"."id")
              INNER JOIN "django_content_type" "U2" ON ("U1"."content_type_id" = "U2"."id")
              WHERE ("U0"."permission_id" = ("trusts_bind"."permission_id")
                  AND "U2"."app_label" = ("trusts_bind"."app_label")
                  AND "U2"."model" = ("trusts_bind"."model")
                  AND "U0"."user_id" = ("trusts_bind"."user_id")
                  AND "U0"."document_id" = ("documents_document"."id")
              )
              LIMIT 1
            )
        has_perm:
          params: [{const: 1, hint: "content pk"}, {bind: "permission.id", hint: "$permission"}, {const: "documents", hint: "content type app"}, {const: "document", hint: "content type model"}, {bind: "user.id", hint: "$user"}]
          sql: |-
            SELECT 1 AS "a"
            FROM "documents_document"
            CROSS JOIN (
              SELECT %s AS "content_pk", %s AS "permission_id", %s AS "app_label", %s AS "model", %s AS "user_id"
            ) "trusts_bind"
            WHERE ("documents_document"."id" = ("trusts_bind"."content_pk")
              AND EXISTS (
                SELECT 1 AS "a"
                FROM "documents_documentpermission" "U0"
                INNER JOIN "auth_permission" "U1" ON ("U0"."permission_id" = "U1"."id")
                INNER JOIN "django_content_type" "U2" ON ("U1"."content_type_id" = "U2"."id")
                WHERE ("U0"."permission_id" = ("trusts_bind"."permission_id")
                    AND "U2"."app_label" = ("trusts_bind"."app_label")
                    AND "U2"."model" = ("trusts_bind"."model")
                    AND "U0"."user_id" = ("trusts_bind"."user_id")
                    AND "U0"."document_id" = ("documents_document"."id")
                )
                LIMIT 1
              ) )
            LIMIT 1
        get_all_permissions:
          params: [{const: 1, hint: "content pk"}, {const: "documents", hint: "content type app"}, {const: "document", hint: "content type model"}, {bind: "user.id", hint: "$user"}]
          sql: |-
            SELECT DISTINCT "auth_permission"."id", "auth_permission"."name", "auth_permission"."content_type_id", "auth_permission"."codename", "django_content_type"."app_label", "django_content_type"."model"
            FROM "auth_permission"
            CROSS JOIN (
              SELECT %s AS "content_pk", %s AS "app_label", %s AS "model", %s AS "user_id"
            ) "trusts_bind"
            INNER JOIN "django_content_type" ON ("auth_permission"."content_type_id" = "django_content_type"."id")
            WHERE (
              EXISTS (
                SELECT 1 AS "a"
                FROM "documents_document" "U0"
                WHERE "U0"."id" = ("trusts_bind"."content_pk")
                LIMIT 1
              )
              AND NOT ( EXISTS (
                  SELECT 1 AS "a"
                  FROM "documents_document" "V0"
                  WHERE ("V0"."id" = ("trusts_bind"."content_pk")
                      AND NOT ( EXISTS (
                        SELECT 1 AS "a"
                        FROM "documents_documentpermission" "U0"
                        INNER JOIN "auth_permission" "U1" ON ("U0"."permission_id" = "U1"."id")
                        INNER JOIN "django_content_type" "U2" ON ("U1"."content_type_id" = "U2"."id")
                        WHERE ("U0"."permission_id" = ("auth_permission"."id")
                            AND "U2"."app_label" = ("trusts_bind"."app_label")
                            AND "U2"."model" = ("trusts_bind"."model")
                            AND "U0"."user_id" = ("trusts_bind"."user_id")
                            AND "U0"."document_id" = ("V0"."id")
                        )
                        LIMIT 1
                      ) ) )
                  LIMIT 1
                ) ) )
            ORDER BY "django_content_type"."app_label" ASC, "django_content_type"."model" ASC, "auth_permission"."codename" ASC
        get_permitted_users:
          params: [{bind: "content.id", hint: "$content"}, {bind: "permission.id", hint: "$permission"}, {const: "documents", hint: "content type app"}, {const: "document", hint: "content type model"}, {const: true, hint: "active"}]
          sql: |-
            SELECT DISTINCT "auth_user"."id", "auth_user"."password", "auth_user"."last_login", "auth_user"."is_superuser", "auth_user"."username", "auth_user"."first_name", "auth_user"."last_name", "auth_user"."email", "auth_user"."is_staff", "auth_user"."is_active", "auth_user"."date_joined"
            FROM "auth_user"
            CROSS JOIN (
              SELECT %s AS "content_id", %s AS "permission_id", %s AS "app_label", %s AS "model"
            ) "trusts_bind"
            WHERE ("auth_user"."is_active" = %s
              AND EXISTS (
                SELECT 1 AS "a"
                FROM "documents_documentpermission" "U0"
                INNER JOIN "auth_permission" "U2" ON ("U0"."permission_id" = "U2"."id")
                INNER JOIN "django_content_type" "U3" ON ("U2"."content_type_id" = "U3"."id")
                WHERE ("U0"."document_id" = ("trusts_bind"."content_id")
                    AND "U0"."permission_id" = ("trusts_bind"."permission_id")
                    AND "U3"."app_label" = ("trusts_bind"."app_label")
                    AND "U3"."model" = ("trusts_bind"."model")
                    AND "U0"."user_id" = ("auth_user"."id")
                )
                LIMIT 1
              ) )
        named_filters:
          - id: "documents__Document__non_confidential"
            params: [{const: true, hint: "confidential"}]
            sql: |-
              SELECT "documents_document"."id", "documents_document"."title", "documents_document"."confidential"
              FROM "documents_document"
              WHERE ("documents_document"."confidential" IS NULL
                  OR NOT ("documents_document"."confidential" = %s)
              )
