[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-trusts-zero"
version = "1.0.0.dev0"
description = "Historical concrete Trust/Content/Role/Group implementation for the django-trusts kernel"
readme = "README.md"
license = "BSD-2-Clause"
authors = [
    { name = "Thomas Yip", email = "thomasleaf@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "django-trusts",
    "Django>=6.1,<6.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["django", "authorization", "permissions", "organizations"]

[project.urls]
Homepage = "https://github.com/django-trusts/django-trusts-zero"
Repository = "https://github.com/django-trusts/django-trusts-zero"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
namespaces = true
include = ["trusts.zero*"]

[tool.setuptools.package-data]
"trusts.zero" = ["templates/**/*"]
