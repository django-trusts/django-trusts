name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

env:
  # Exact merged Zero #142 Z-convert head. Stage B pairs only with this SHA.
  COMPANION_ZERO_SHA: bceb0241b482fdc4f31dd72c7600c52eeb4e6cff

jobs:
  tests:
    name: tests kernel-only (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package and Django 6.1
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .
    - name: Kernel-only authorization tests
      run: |
        coverage run -m tests.runtests
        coverage report
    - name: Generate Cobertura coverage.xml
      if: matrix.python-version == '3.12'
      run: coverage xml
    - name: Upload coverage to Coveralls
      if: matrix.python-version == '3.12'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage.xml
        format: cobertura
        compare-ref: dev
    - name: Fresh migrate (no Trusts schema)
      run: python -m django migrate --noinput --settings=tests.settings
    - name: System checks
      run: python -m django check --settings=tests.settings

  tests-orderedfold-pg:
    name: tests OrderedFold PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trusts
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TRUSTS_TEST_DATABASE: postgresql
      TRUSTS_PG_NAME: trusts
      TRUSTS_PG_USER: postgres
      TRUSTS_PG_PASSWORD: postgres
      TRUSTS_PG_HOST: 127.0.0.1
      TRUSTS_PG_PORT: 5432
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install package, Django 6.1, and psycopg
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" "psycopg[binary]" coverage
        python -m pip install -e .
    - name: OrderedFold PostgreSQL regressions
      env:
        DJANGO_SETTINGS_MODULE: tests.fold_settings
      run: python -m tests.runtests tests.core.test_issue100

  pair-iia:
    name: pair with Zero #37 STAGE 1
    runs-on: ubuntu-latest
    env:
      ZERO_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts-zero
      KERNEL_CHECKOUT: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts-zero
        ref: ${{ env.COMPANION_ZERO_SHA }}
        path: .deps/django-trusts-zero
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install core 1.0.0.dev3 then Zero STAGE 1
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e . --config-settings editable_mode=compat
        python -m pip install -e .deps/django-trusts-zero --config-settings editable_mode=compat
    - name: Matrix B pair proofs
      run: python scripts/verify-pair-zero.py
    - name: Library suite against paired Zero
      run: python scripts/run-core-pair-tests.py
    - name: Zero complete suite from Zero checkout
      run: python scripts/run-z1-pair-tests.py

  package:
    name: package
    runs-on: ubuntu-latest
    env:
      ZERO_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts-zero
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts-zero
        ref: ${{ env.COMPANION_ZERO_SHA }}
        path: .deps/django-trusts-zero
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install documentation and packaging tools
      run: |
        python -m pip install --upgrade pip build twine "Sphinx>=8,<9"
        python -m pip install "Django>=6.1,<6.2"
    - name: Build documentation without warnings
      run: sphinx-build -nW docs/source docs/_build/html
    - name: Build sdist and wheel
      run: |
        python -m build
        twine check dist/*
    - name: Package metadata (README, LICENSE, BSD-2-Clause)
      run: python scripts/verify-package-metadata.py
    - name: Install kernel wheel and import from outside the checkout
      env:
        PYTHONPATH: ""
      run: |
        python -m pip install dist/django_trusts-*.whl
        WORK="$(mktemp -d)"
        cd "$WORK"
        python "${GITHUB_WORKSPACE}/scripts/verify-wheel-install.py" --checkout "${GITHUB_WORKSPACE}"
    - name: Companion C2 + Z1 wheels
      run: |
        python -m pip install build
        python -m build --wheel --outdir .deps/django-trusts-zero/dist .deps/django-trusts-zero
        python scripts/verify-companion-wheels.py
