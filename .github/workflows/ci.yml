name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

env:
  # Merged Zero #36 / #191 decorator family (squash).
  COMPANION_ZERO_SHA: 517307170f954f187da78c56e236ec1779c46e29
  # Reviewed consumer pins from #195. Compat jobs install this C2 checkout,
  # not the C1 squash those packages still list in their own CI.
  COMPANION_ORDERED_FOLD_SHA: c8c649aa5278db2b11fc380fa1646ae73df471ac
  COMPANION_WINDOWS_SHA: 333a8c7f6b8074d3a55f571846ee57892d8e97dd

jobs:
  tests:
    name: tests kernel-only (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package and Django 6.1
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .
    - name: Kernel-only authorization tests
      run: |
        coverage run -m tests.runtests
        coverage report
    - name: Generate Cobertura coverage.xml
      if: matrix.python-version == '3.12'
      run: coverage xml
    - name: Upload coverage to Coveralls
      if: matrix.python-version == '3.12'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage.xml
        format: cobertura
        compare-ref: dev
    - name: Fresh migrate (no Trusts schema)
      run: python -m django migrate --noinput --settings=tests.settings
    - name: System checks
      run: python -m django check --settings=tests.settings

  pair-iia:
    name: pair with Zero #191 decorators
    runs-on: ubuntu-latest
    env:
      ZERO_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts-zero
      KERNEL_CHECKOUT: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts-zero
        ref: ${{ env.COMPANION_ZERO_SHA }}
        path: .deps/django-trusts-zero
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install core 1.0.0.dev3 then Zero #191 decorators
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e . --config-settings editable_mode=compat
        python -m pip install -e .deps/django-trusts-zero --config-settings editable_mode=compat
    - name: Matrix B pair proofs
      run: python scripts/verify-pair-zero.py
    - name: Library suite against paired Zero
      run: python scripts/run-core-pair-tests.py
    - name: Zero complete suite from Zero checkout
      run: python scripts/run-z1-pair-tests.py

  package:
    name: package
    runs-on: ubuntu-latest
    env:
      ZERO_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts-zero
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts-zero
        ref: ${{ env.COMPANION_ZERO_SHA }}
        path: .deps/django-trusts-zero
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install documentation and packaging tools
      run: |
        python -m pip install --upgrade pip build twine "Sphinx>=8,<9"
        python -m pip install "Django>=6.1,<6.2"
    - name: Build documentation without warnings
      run: sphinx-build -nW docs/source docs/_build/html
    - name: Build sdist and wheel
      run: |
        python -m build
        twine check dist/*
    - name: Package metadata (README, LICENSE, BSD-2-Clause)
      run: python scripts/verify-package-metadata.py
    - name: Install kernel wheel and import from outside the checkout
      env:
        PYTHONPATH: ""
      run: |
        python -m pip install dist/django_trusts-*.whl
        WORK="$(mktemp -d)"
        cd "$WORK"
        python "${GITHUB_WORKSPACE}/scripts/verify-wheel-install.py" --checkout "${GITHUB_WORKSPACE}"
    - name: Companion Core + Zero #191 decorator wheels
      run: |
        python -m pip install build
        python -m build --wheel --outdir .deps/django-trusts-zero/dist .deps/django-trusts-zero
        python scripts/verify-companion-wheels.py

  compat-orderedfold-p2:
    name: compat OrderedFold P2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trusts
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}
      ORDERED_FOLD_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts-ordered-fold
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts-ordered-fold
        ref: ${{ env.COMPANION_ORDERED_FOLD_SHA }}
        path: .deps/django-trusts-ordered-fold
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Exact P2 pin against this C2 checkout
      run: |
        test "${COMPANION_ORDERED_FOLD_SHA}" = "c8c649aa5278db2b11fc380fa1646ae73df471ac"
        test "$(git -C .deps/django-trusts-ordered-fold rev-parse HEAD)" = "c8c649aa5278db2b11fc380fa1646ae73df471ac"
        test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
    - name: Install this C2 Core, then pinned OrderedFold P2
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" "psycopg[binary]"
        python -m pip install -e . --config-settings editable_mode=compat
        python -m pip install -e .deps/django-trusts-ordered-fold --config-settings editable_mode=compat
    - name: Rewrite P2 dual-write leftovers for C2 deletion
      run: python scripts/adapt-orderedfold-p2-for-c2.py .deps/django-trusts-ordered-fold
    - name: OrderedFold P2 package suite
      working-directory: .deps/django-trusts-ordered-fold
      run: python -m tests.runtests
    - name: OrderedFold P2 PostgreSQL regressions
      working-directory: .deps/django-trusts-ordered-fold
      env:
        TRUSTS_TEST_DATABASE: postgresql
        TRUSTS_PG_NAME: trusts
        TRUSTS_PG_USER: postgres
        TRUSTS_PG_PASSWORD: postgres
        TRUSTS_PG_HOST: 127.0.0.1
        TRUSTS_PG_PORT: 5432
        DJANGO_SETTINGS_MODULE: tests.fold_settings
      run: python -m tests.runtests tests.test_issue100 tests.test_fixed_query tests.test_backend

  compat-windows-w:
    name: compat Windows W
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: winfs
          POSTGRES_PASSWORD: winfs
          POSTGRES_DB: winfs
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U winfs -d winfs"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      KERNEL_CHECKOUT: ${{ github.workspace }}
      DATABASE_URL: postgres://winfs:winfs@127.0.0.1:5432/winfs
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts-ordered-fold
        ref: ${{ env.COMPANION_ORDERED_FOLD_SHA }}
        path: .deps/django-trusts-ordered-fold
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts-windows-acl
        ref: ${{ env.COMPANION_WINDOWS_SHA }}
        path: .deps/django-trusts-windows-acl
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Exact W and P2 pins against this C2 checkout
      run: |
        test "${COMPANION_WINDOWS_SHA}" = "333a8c7f6b8074d3a55f571846ee57892d8e97dd"
        test "$(git -C .deps/django-trusts-windows-acl rev-parse HEAD)" = "333a8c7f6b8074d3a55f571846ee57892d8e97dd"
        test "$(git -C .deps/django-trusts-ordered-fold rev-parse HEAD)" = "c8c649aa5278db2b11fc380fa1646ae73df471ac"
        test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
        python - <<'PY'
        from pathlib import Path
        req = Path('.deps/django-trusts-windows-acl/requirements.txt').read_text()
        assert '6934894489d4fc0e46de88b55b9a27f5f2eb2b41' in req
        PY
    - name: Install this C2 Core, P2, and Windows deps (not the C1 git pin)
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" "dj-database-url>=2.3.0" "psycopg[binary]>=3.2"
        python -m pip install -e . --config-settings editable_mode=compat
        python -m pip install -e .deps/django-trusts-ordered-fold --config-settings editable_mode=compat
    - name: Django system checks
      working-directory: .deps/django-trusts-windows-acl
      run: python manage.py check
    - name: Windows W AccessCheck matrix against this C2
      working-directory: .deps/django-trusts-windows-acl
      run: python manage.py test winfs
    - name: Migrate and seed_winfs
      working-directory: .deps/django-trusts-windows-acl
      run: |
        python manage.py migrate --noinput
        python manage.py seed_winfs

