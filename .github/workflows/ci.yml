name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

env:
  # Zero registry-at-models, PR #54, CI run 39756967058.
  COMPANION_ZERO_SHA: 66f21235988264f0ea23f3da45efb54cb768bf29
  # Exact GH Permissions candidate companion.
  COMPANION_GH_SHA: 3bd80f82199b37cd34c1028ecd669e88711c3270

jobs:
  tests:
    name: tests kernel-only (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package and Django 6.1
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e .
    - name: Kernel-only authorization tests
      run: |
        coverage run -m tests.runtests
        coverage report
    - name: Unsupported database aliases
      env:
        DJANGO_SETTINGS_MODULE: tests.unsupported_db_settings
      run: >
        python -m tests.runtests
        tests.core.test_issue92.AlongE005Test.test_unsupported_and_several_aliases
        tests.core.test_issue147.test_sql_export.PolicySqlGoldenTest.test_along_failure_does_not_return_a_partial_document
    - name: Generate Cobertura coverage.xml
      if: matrix.python-version == '3.12'
      run: coverage xml
    - name: Upload coverage to Coveralls
      if: matrix.python-version == '3.12'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage.xml
        format: cobertura
        compare-ref: dev
    - name: Fresh migrate (no Trusts schema)
      run: python -m django migrate --noinput --settings=tests.settings
    - name: System checks
      run: python -m django check --settings=tests.settings

  pair-iia:
    name: pair with exact Zero candidate
    runs-on: ubuntu-latest
    env:
      ZERO_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts-zero
      KERNEL_CHECKOUT: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts-zero
        ref: ${{ env.COMPANION_ZERO_SHA }}
        path: .deps/django-trusts-zero
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install django-trusts then exact Zero candidate
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" coverage
        python -m pip install -e . --config-settings editable_mode=compat
        python -m pip install -e .deps/django-trusts-zero --config-settings editable_mode=compat
    - name: Matrix B pair proofs
      run: python scripts/verify-pair-zero.py
    - name: Library suite against paired Zero
      run: python scripts/run-core-pair-tests.py
    - name: Zero complete suite from Zero checkout
      run: python scripts/run-z1-pair-tests.py

  along-postgresql:
    name: along tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trusts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trusts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TRUSTS_TEST_DATABASE: postgresql
      TRUSTS_PG_HOST: 127.0.0.1
      TRUSTS_PG_PORT: "5432"
      TRUSTS_PG_USER: postgres
      TRUSTS_PG_PASSWORD: postgres
      TRUSTS_PG_NAME: trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install package, Django 6.1, and psycopg
      run: |
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" "psycopg[binary]>=3.1"
        python -m pip install -e .
    - name: Along forward and reverse tests
      env:
        DJANGO_SETTINGS_MODULE: tests.along_db_settings
      run: python -m tests.runtests tests.core.test_issue92 tests.core.test_issue282 tests.core.test_issue282_permitted_content

  along-mysql:
    name: along tests (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: trusts
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TRUSTS_TEST_DATABASE: mysql
      TRUSTS_MYSQL_HOST: 127.0.0.1
      TRUSTS_MYSQL_PORT: "3306"
      TRUSTS_MYSQL_USER: root
      TRUSTS_MYSQL_PASSWORD: root
      TRUSTS_MYSQL_NAME: trusts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install package, Django 6.1, and mysqlclient
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config default-libmysqlclient-dev
        python -m pip install --upgrade pip
        python -m pip install "Django>=6.1,<6.2" mysqlclient
        python -m pip install -e .
    - name: Along forward and reverse tests
      env:
        DJANGO_SETTINGS_MODULE: tests.along_db_settings
      run: python -m tests.runtests tests.core.test_issue92 tests.core.test_issue282 tests.core.test_issue282_permitted_content

  package:
    name: package
    runs-on: ubuntu-latest
    env:
      ZERO_CHECKOUT: ${{ github.workspace }}/.deps/django-trusts-zero
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: django-trusts/django-trusts-zero
        ref: ${{ env.COMPANION_ZERO_SHA }}
        path: .deps/django-trusts-zero
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install documentation and packaging tools
      run: |
        python -m pip install --upgrade pip build twine "Sphinx>=8,<9"
        python -m pip install "Django>=6.1,<6.2"
    - name: Build documentation without warnings
      run: sphinx-build -nW docs/source docs/_build/html
    - name: Build sdist and wheel
      run: |
        python -m build
        twine check dist/*
    - name: Package metadata (README, LICENSE, BSD-2-Clause)
      run: python scripts/verify-package-metadata.py
    - name: Install kernel wheel and import from outside the checkout
      env:
        PYTHONPATH: ""
      run: |
        python -m pip install dist/django_trusts-*.whl
        WORK="$(mktemp -d)"
        cd "$WORK"
        python "${GITHUB_WORKSPACE}/scripts/verify-wheel-install.py" --checkout "${GITHUB_WORKSPACE}"
    - name: Installed-wheel Pyright contextual typing
      env:
        PYTHONPATH: ""
      run: |
        python -m pip install pyright
        WORK="$(mktemp -d)"
        cd "$WORK"
        python "${GITHUB_WORKSPACE}/scripts/verify-wheel-pyright.py" --checkout "${GITHUB_WORKSPACE}"
    - name: Companion django-trusts + exact Zero candidate wheels
      run: |
        python -m pip install build
        python -m build --wheel --outdir .deps/django-trusts-zero/dist .deps/django-trusts-zero
        python scripts/verify-companion-wheels.py

  # Zero and GH Permissions against this Core commit, without editing
  # their pins. Same-named branch, else the pinned SHA while it is not
  # in companion dev, else dev, else the stable branch. A failure is
  # reported and does not block the workflow. This job does not comment
  # on the pull request.
  follow-companions:
    name: follow Core (${{ matrix.companion }})
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TRUSTS_POLICY_LOCKFILE: ${{ github.workspace }}/companion/.ci/trusts-policy.sqlite.lock.yaml
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - companion: zero
            repository: django-trusts/django-trusts-zero
            lockfile: false
          - companion: gh-permissions
            repository: django-trusts/django-trusts-gh-permissions
            lockfile: true
    steps:
    - name: Check out Core
      uses: actions/checkout@v4
      with:
        path: core

    # 1. same-named branch, if the companion has one.
    # 2. the pinned SHA, while that commit is not in companion dev.
    # 3. companion dev.
    # 4. the companion's stable branch.
    - name: Select companion ref
      id: companion
      env:
        REPOSITORY: ${{ matrix.repository }}
        COMPANION: ${{ matrix.companion }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        url="https://github.com/${REPOSITORY}.git"
        core_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        if [ -z "${core_branch}" ]; then
          echo "Core branch name is empty" >&2
          exit 1
        fi
        echo "Core branch: ${core_branch}"
        case "${COMPANION}" in
          zero) pin="${COMPANION_ZERO_SHA}" ;;
          gh-permissions) pin="${COMPANION_GH_SHA}" ;;
          *)
            echo "No pinned SHA for companion ${COMPANION}" >&2
            exit 1
            ;;
        esac
        echo "Pinned SHA: ${pin}"

        # Stable branch is the companion's GitHub default branch.
        # Admins must keep that default on master or main, not dev.
        symref="$(git ls-remote --symref "${url}" HEAD)"
        stable="$(printf '%s\n' "${symref}" | awk '/^ref: refs\/heads\// { sub(/^refs\/heads\//, "", $2); print $2; exit }')"
        if [ -z "${stable}" ]; then
          echo "Could not read the GitHub default branch of ${REPOSITORY}" >&2
          printf '%s\n' "${symref}" >&2
          exit 1
        fi
        echo "Stable branch (GitHub default): ${stable}"
        if [ "${stable}" = "dev" ]; then
          echo "The GitHub default branch of ${REPOSITORY} is dev." >&2
          echo "CI uses that default as the stable branch. It must be master or main." >&2
          exit 1
        fi

        heads="$(git ls-remote --heads "${url}")"
        branch_exists() {
          printf '%s\n' "${heads}" | awk -v ref="refs/heads/${1}" '$2 == ref { found = 1 } END { exit (found ? 0 : 1) }'
        }
        if branch_exists "${core_branch}"; then
          ref="${core_branch}"
          rule="same-named branch"
        elif branch_exists "dev"; then
          # compare pin...dev: ahead or identical means dev contains the pin.
          status="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/compare/${pin}...dev" \
            | jq -r '.status')"
          echo "Compare ${pin}...dev: ${status}"
          case "${status}" in
            ahead|identical)
              ref="dev"
              rule="pinned SHA is in dev"
              ;;
            behind|diverged)
              ref="${pin}"
              rule="pinned SHA is not in dev"
              ;;
            *)
              echo "Unexpected compare status '${status}' for ${pin}...dev" >&2
              exit 1
              ;;
          esac
        elif branch_exists "${stable}"; then
          ref="${stable}"
          rule="stable branch"
        else
          echo "No branch named ${core_branch} or ${stable}, and no dev, in ${REPOSITORY}" >&2
          exit 1
        fi
        echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
        echo "stable=${stable}" >> "${GITHUB_OUTPUT}"
        echo "rule=${rule}" >> "${GITHUB_OUTPUT}"
        echo "Companion rule: ${rule}"
        echo "Companion ref: ${ref}"

    - name: Check out companion
      uses: actions/checkout@v4
      with:
        repository: ${{ matrix.repository }}
        ref: ${{ steps.companion.outputs.ref }}
        path: companion

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install companion requirements, then this Core commit
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r companion/requirements.txt
        python -m pip install --no-deps --force-reinstall ./core

    - name: Log tested revisions
      run: |
        echo "Core SHA: $(git -C core rev-parse HEAD)"
        echo "Companion rule: ${{ steps.companion.outputs.rule }}"
        echo "Companion ref: ${{ steps.companion.outputs.ref }}"
        echo "Companion stable branch: ${{ steps.companion.outputs.stable }}"
        echo "Companion SHA: $(git -C companion rev-parse HEAD)"

    # Zero's runner puts KERNEL_CHECKOUT first and drops every other
    # directory that contains a trusts package. A normal install of Core
    # places that package in site-packages, so the runner would drop
    # Django too. Point it at this checkout and keep Django beside it.
    - name: Keep Django importable for Zero's test runner
      if: matrix.companion == 'zero'
      run: |
        target="${RUNNER_TEMP}/zero-runner-deps"
        python -m pip install --target "${target}" "Django>=6.1,<6.2" "PyYAML>=6.0.3"
        echo "KERNEL_CHECKOUT=${GITHUB_WORKSPACE}/core" >> "${GITHUB_ENV}"
        echo "PYTHONPATH=${target}" >> "${GITHUB_ENV}"

    - name: Generate SQLite policy lockfile
      id: policy-lock
      if: ${{ matrix.lockfile == true && !cancelled() }}
      working-directory: companion
      run: |
        mkdir -p .ci
        python manage.py trusts_policy_sql --lock


    - name: Companion test suite
      working-directory: companion
      env:
        TRUSTS_FOLLOW_CORE: "1"
      run: python -m tests.runtests

    - name: Upload SQLite policy lockfile
      if: ${{ !cancelled() && matrix.lockfile == true && steps.policy-lock.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: gh-permissions-sqlite-policy-lock
        path: companion/.ci/trusts-policy.sqlite.lock.yaml
        retention-days: 7
        if-no-files-found: error

